[project]
name = "pylon-cz"
version = "0.1.0"
description = "Commitizen plugin filtering changelog by Impacts footer"
requires-python = ">=3.11"
dependencies = ["commitizen>=4.13"]

[project.entry-points."commitizen.plugin"]
pylon_client_cz = "pylon_cz:PylonClientCz"
pylon_service_cz = "pylon_cz:PylonServiceCz"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pylon_cz.py", "pylon_cz_helpers.py"]
