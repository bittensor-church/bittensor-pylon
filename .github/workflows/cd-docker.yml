name: CD Docker

on:
  push:
    tags:
      - 'service-v*'

env:
  DOCKER_REPO_NAME: "backenddevelopersltd/bittensor-pylon"

permissions:
  contents: read

jobs:
  docker-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#service-v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: pylon_service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_REPO_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    runs-on: ubuntu-latest
    needs: docker-push
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pylon_service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#service-v}"
          uv run cz changelog "$VERSION" --dry-run > ../release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release_notes.md

  notify-slack:
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - name: Send to Slack
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Released ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 Released *${{ github.ref_name }}* — <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}|view changelog>"
                  }
                }
              ]
            }
