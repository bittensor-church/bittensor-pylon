name: Release (service)

on:
  push:
    tags:
      - 'service-v*'

env:
  DOCKER_REPO_NAME: "backenddevelopersltd/bittensor-pylon"

permissions:
  contents: read

jobs:
  docker-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#service-v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: pylon_service/Dockerfile
          push: true
          build-args: |
            SERVICE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ${{ env.DOCKER_REPO_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_REPO_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker-push
    uses: reef-technologies/release-toolkit/.github/workflows/make-github-release.yml@v0.4.0
    with:
      package_dir: pylon_service
      tag_prefix: service-v
      python_version: '3.13'
    secrets:
      SLACK_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK_URL }}
    permissions:
      contents: write
